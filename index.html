<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@dsewerek</title>
<meta name="description" content="dsewerek's links, Discord status, Minecraft, GitHub, YouTube and favourite song.">
<meta name="theme-color" content="#f27db3">
<meta property="og:title" content="@dsewerek">
<meta property="og:description" content="Links, Discord status and my favourite song.">
<meta property="og:image" content="https://cdn.discordapp.com/avatars/1292535443619053580/fe5ced9ee96b108ae1432c0f2a5f2ba2.png?size=512">
<meta name="twitter:card" content="summary">
<link rel="icon" href="https://cdn.discordapp.com/avatars/1292535443619053580/fe5ced9ee96b108ae1432c0f2a5f2ba2.png?size=64">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="preload" as="image" href="https://r2.haunt.gg/background/ba641f68-4646-4618-95f9-0dae61bda05b.png" fetchpriority="high">
<style>
  :root{
    --void:#030303;
    --chalk:#ffffff;
    --haze:#dddddd;
    --mist:#a1a1aa;
    --blush:#f27db3;
    --plum:#6a1b8a;
    --glass:rgba(16,16,18,.46);
    --glass-2:rgba(255,255,255,.07);
    --edge:rgba(255,255,255,.10);
    --edge-2:rgba(255,255,255,.20);
    --font:"Satoshi", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    /* How big the Velora card is on screens 1280px+ wide. 1 = its normal 340px width. */
    --velora-zoom:1.75;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100svh;font-family:var(--font);font-size:1rem;line-height:1.5;color:var(--chalk);
    background:var(--void) radial-gradient(120% 70% at 50% 0%,#2b0f24 0%,transparent 62%) fixed;
    overflow-x:hidden;
  }
  body:not(.entered){overflow:hidden}
  img{display:block;max-width:100%}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--blush);outline-offset:3px;border-radius:8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  svg.i{width:20px;height:20px;fill:currentColor;flex:none}

  /* ---------- background ---------- */
  .backdrop{position:fixed;inset:0;z-index:-10;pointer-events:none;overflow:hidden}
  .backdrop img{width:100%;height:100%;object-fit:cover}
  .backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(3,3,3,.22),rgba(3,3,3,.5) 55%,rgba(3,3,3,.82))}

  /* ---------- enter screen ---------- */
  .enter{
    position:fixed;inset:0;z-index:60;width:100%;border:0;margin:0;padding:24px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(3,3,3,.58);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    transition:opacity .6s ease,visibility .6s;
  }
  .enter-word{font-size:2.5rem;font-weight:500;letter-spacing:.04em;line-height:1}
  .enter-hint{font-size:.875rem;color:var(--mist)}
  .enter:focus-visible{outline:none}
  .enter:focus-visible .enter-word{outline:2px solid var(--blush);outline-offset:10px;border-radius:10px}
  .entered .enter{opacity:0;visibility:hidden;pointer-events:none}

  /* ---------- floating controls ---------- */
  .dock{
    position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:14px;
    display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
    background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
  .icon-btn:hover{background:var(--glass-2)}
  .icon-btn:disabled{opacity:.4;cursor:not-allowed}
  .icon-btn svg.i{width:18px;height:18px}
  .dock input[type=range]{width:86px;margin:0 12px 0 6px}
  .ic-pause,.ic-mute{display:none}
  .playing .ic-play{display:none}
  .playing .ic-pause{display:block}
  .is-muted .ic-vol{display:none}
  .is-muted .ic-mute{display:block}

  .rail{position:fixed;z-index:30;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
  .rail button{position:relative;display:block;width:28px;height:18px;padding:0;border:0;background:transparent;cursor:pointer}
  .rail button::before{content:"";position:absolute;right:0;top:50%;height:2px;width:12px;margin-top:-1px;border-radius:2px;background:rgba(255,255,255,.35);transition:width .3s ease,background-color .3s ease}
  .rail button:hover::before{background:rgba(255,255,255,.7)}
  .rail button[aria-current="true"]::before{width:24px;background:var(--blush)}
  @media (max-width:760px){.rail{display:none}}

  /* ---------- range inputs ---------- */
  input[type=range]{-webkit-appearance:none;appearance:none;height:22px;margin:0;background:transparent;cursor:pointer;--p:0%}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--blush) var(--p),rgba(255,255,255,.2) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border:0;border-radius:50%;background:var(--chalk)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--blush)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--chalk)}
  input[type=range]:focus-visible{outline-offset:4px}

  /* ---------- sections ---------- */
  .screen{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:88px 20px 64px}

  /* ---------- profile ---------- */
  .profile{
    container:card / inline-size;
    width:100%;padding:36px 28px 22px;border-radius:28px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:var(--glass);border:2px solid var(--edge);
    -webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);
  }
  .entered .profile,.entered .below{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .entered .below{animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}

  .ph{position:relative;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:rgba(255,255,255,.08);color:var(--haze);font-weight:700}
  .ph::before{content:attr(data-letter)}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph img.broken{opacity:0}
  .avatar{width:120px;height:120px;font-size:2.75rem;box-shadow:0 0 0 2px var(--edge-2)}

  .name{margin:18px 0 0;font-size:2.75rem;line-height:1.1;font-weight:900;letter-spacing:-.01em;overflow-wrap:anywhere}
  .handle{margin:4px 0 0;font-size:.9375rem;color:var(--mist)}

  .widgets{width:100%;margin-top:24px;display:grid;gap:12px;grid-template-columns:1fr}
  @container card (min-width:480px){.widgets{grid-template-columns:1fr 1fr}}
  @container card (min-width:480px) and (max-width:620px){
    .widgets .w{padding:12px;gap:12px}
    .widgets .dc-av .ph{width:44px;height:44px}
    .widgets .dc-dot{width:15px;height:15px}
    .widgets .mc-head{width:46px;height:46px}
    .widgets .w-go{padding:6px 12px}
  }
  .w{min-width:0;min-height:5.5rem;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass-2);border:1px solid var(--edge);text-align:left}
  .w-body{min-width:0;flex:1}
  .w-title,.w-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-title{font-weight:700;font-size:1rem;line-height:1.3}
  .w-sub{font-size:.875rem;color:var(--haze)}
  .w-faint{font-size:.8125rem;color:var(--mist)}
  .w-go{flex:none;padding:7px 14px;border-radius:999px;background:var(--chalk);color:#000;font-size:.8125rem;font-weight:700;text-decoration:none;white-space:nowrap}
  .w-go:hover{background:var(--haze)}

  .dc-av{position:relative;flex:none}
  .dc-av .ph{width:56px;height:56px;font-size:1.25rem}
  .dc-dot{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:#80848e;box-shadow:0 0 0 3px #19191c}
  .dc-dot[hidden]{display:none}
  .dc-dot[data-status=online]{background:#23a55a}
  .dc-dot[data-status=idle]{background:#f0b232}
  .dc-dot[data-status=dnd]{background:#f23f43}
  .dc-art{width:48px;height:48px;flex:none;border-radius:10px;object-fit:cover}
  .dc-art[hidden]{display:none}

  .mc-head{width:58px;height:58px;flex:none;image-rendering:pixelated}
  .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--edge);background:transparent;font-size:.8125rem;color:var(--haze);cursor:pointer;font-variant-numeric:tabular-nums}
  .chip:hover{border-color:var(--edge-2);color:var(--chalk)}
  .chip svg.i{width:14px;height:14px}
  .chip[hidden]{display:none}

  .links{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .links a{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;color:var(--c);text-decoration:none;transition:transform .2s ease}
  .links a:hover{transform:scale(1.08)}
  .links svg,.links img{width:34px;height:34px;fill:currentColor;filter:drop-shadow(0 0 3px var(--c))}
  .links .letter{font-weight:900;font-size:1.25rem;color:#c58ae0}
  .links a::after{
    content:attr(data-label);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,4px);
    padding:5px 10px;border-radius:8px;background:rgba(10,10,12,.94);border:1px solid var(--edge);
    color:var(--chalk);font-size:.75rem;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
  }
  .links a:hover::after,.links a:focus-visible::after{opacity:1;transform:translate(-50%,0)}

  .meta{align-self:flex-start;margin-top:20px;display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--haze)}
  .meta svg.i{width:16px;height:16px}

  .below{width:100%;margin-top:12px;display:grid;gap:12px;grid-template-columns:1fr}
  @container col (min-width:520px){.below{grid-template-columns:1fr 1fr}}
  .below .w{border-radius:22px;background:var(--glass);border:2px solid var(--edge);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .gh-av{width:52px;height:52px;font-size:1.25rem}
  .gh-stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-size:.8125rem;color:var(--mist)}
  .gh-stats b{color:var(--chalk);font-weight:700;font-variant-numeric:tabular-nums}
  .yt-tile{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:14px;background:rgba(255,0,0,.12);color:#ff0000}
  .yt-tile svg.i{width:30px;height:30px}

  .scroll-hint{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8125rem;color:var(--haze);text-decoration:none}
  .scroll-hint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .scroll-hint:hover{color:var(--chalk)}

  /* ---------- hero: Velora card + profile, both on the first screen ---------- */
  .hero{overflow:hidden;overflow:clip}
  .hero-grid{width:min(100%,77.5rem);display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:center}
  .profile-col{container:col / inline-size;width:min(100%,44rem);justify-self:center}
  @media (min-width:1100px){
    .hero-grid{grid-template-columns:minmax(0,1fr) 32.5rem;gap:48px}
    .profile-col{width:100%}
  }
  @media (min-width:1280px){.hero-grid{grid-template-columns:minmax(0,1fr) 36rem}}

  /* spotlight on the Velora card */
  .stage{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 64px}
  .stage::before{content:"";position:absolute;z-index:-3;left:50%;top:-160px;bottom:-40px;width:min(900px,140vw);transform:translateX(-50%);
    background:radial-gradient(50% 55% at 50% 52%,rgba(3,3,3,.6),transparent 78%)}
  .beam{position:absolute;top:-260px;bottom:0;left:50%;width:min(900px,150vw);transform:translateX(-50%);z-index:-2;
    filter:blur(22px);opacity:0;transition:opacity 1.4s ease .15s}
  .beam::before{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(255,236,246,.34),rgba(242,125,179,.17) 50%,rgba(106,27,138,.08) 78%,transparent);
    clip-path:polygon(44% 0,56% 0,88% 100%,12% 100%)}
  .velora-wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
  .velora-wrap::after{content:"";position:absolute;left:50%;bottom:-56px;width:min(820px,140vw);height:150px;transform:translateX(-50%);z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(242,125,179,.42),rgba(106,27,138,.2) 58%,transparent);opacity:0;transition:opacity 1.6s ease .35s}
  .stage.lit .beam,.stage.lit .velora-wrap::after{opacity:1}
  .velora-wrap velora-card{max-width:100%;filter:drop-shadow(0 28px 50px rgba(242,125,179,.22))}
  @media (min-width:520px){.velora-wrap velora-card,.velora-wait{zoom:1.3}}
  @media (min-width:1100px){.velora-wrap velora-card,.velora-wait{zoom:1.4}}
  @media (min-width:1280px){.velora-wrap velora-card,.velora-wait{zoom:var(--velora-zoom)}}
  .velora-wait{width:340px;max-width:100%;min-height:200px;display:grid;place-items:center;padding:24px;border-radius:18px;
    border:1px dashed var(--edge-2);background:rgba(16,16,18,.55);color:var(--haze);font-size:.9375rem;line-height:1.45;text-align:center}
  .velora-wait[hidden]{display:none}

  /* ---------- song ---------- */
  .song-inner{width:min(100%,58rem)}
  .song h2{margin:0 0 16px;text-align:right;font-size:1.75rem;line-height:1.2;font-weight:700}
  .record{
    display:grid;grid-template-columns:1fr;gap:28px;padding:24px;border-radius:28px;overflow:hidden;
    background:var(--glass);border:2px solid var(--edge);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  }
  @media (min-width:760px){.record{grid-template-columns:300px 1fr;gap:72px;align-items:center;padding:28px 40px 28px 28px}}
  .sleeve{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin-inline:auto}
  @media (max-width:759px){.sleeve{max-width:240px;margin-inline:auto 30%}}
  .sleeve .cover{position:relative;z-index:1;width:100%;height:100%;border-radius:14px;font-size:3rem}
  .sleeve .cover img{border-radius:14px}
  .vinyl{position:absolute;inset:4%;border-radius:50%;transition:transform .8s cubic-bezier(.2,.7,.2,1);
    background:
      radial-gradient(circle,var(--blush) 0 9%,#0d0d0d 9.5% 11%,transparent 11.5%),
      conic-gradient(from 30deg,rgba(255,255,255,.07),transparent 18%,rgba(255,255,255,.05) 50%,transparent 68%,rgba(255,255,255,.07)),
      repeating-radial-gradient(circle,#111 0 2px,#1a1a1a 2px 3px);
    box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  .playing .vinyl{transform:translateX(22%)}
  .track-title{margin:0;font-size:2.75rem;line-height:1.05;font-weight:900;letter-spacing:-.01em}
  .track-artist{margin:6px 0 0;font-size:1.25rem;font-weight:500;color:var(--haze)}
  .seek{margin-top:28px}
  .seek input{width:100%}
  .times{display:flex;justify-content:space-between;margin-top:2px;font-size:.8125rem;color:var(--mist);font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .play-big{width:60px;height:60px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--chalk);color:#000;cursor:pointer}
  .play-big:hover{background:var(--haze)}
  .play-big:disabled{opacity:.4;cursor:not-allowed}
  .play-big svg.i{width:26px;height:26px}
  .loop-btn{width:44px;height:44px;color:var(--mist)}
  .loop-btn[aria-pressed="true"]{color:var(--blush)}
  .spotify{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--edge-2);font-size:.9375rem;font-weight:500;text-decoration:none}
  .spotify:hover{background:var(--glass-2)}
  .spotify svg.i{fill:#1ed760}
  .song-status{margin:12px 0 0;font-size:.875rem;color:var(--haze)}
  .song-status[hidden]{display:none}

  .site-foot{display:flex;justify-content:center;padding:0 20px 36px;font-size:.8125rem}
  .site-foot a{color:var(--mist);text-decoration:none}
  .site-foot a:hover{color:var(--chalk);text-decoration:underline}

  @media (max-width:420px){
    .profile{padding:30px 18px 18px}
    .name{font-size:2.25rem}
    .track-title{font-size:2.25rem}
    .dock input[type=range]{width:64px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}
  }
</style>
</head>

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></symbol>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- image fallbacks ----------
     Each image can list backups in data-alt="url|url". If every source fails,
     avatars show a letter, and other images hide or swap for a letter. */
  function wireImg(img, giveUp) {
    if (!img) return;
    const alts = (img.dataset.alt || '').split('|').filter(Boolean);
    const next = () => {
      const n = alts.shift();
      if (n) { img.src = n; return; }
      img.classList.add('broken');
      if (giveUp) giveUp(img);
    };
    img.addEventListener('error', next);
    img.addEventListener('load', () => img.classList.remove('broken'));
    if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) next();
  }
  $$('img[data-ph]').forEach(img => wireImg(img));
  wireImg($('#bgImg'), img => img.remove());
  wireImg($('#mcHead'), img => { img.style.visibility = 'hidden'; });
  wireImg($('#gunsIcon'), img => {
    const s = document.createElement('span');
    s.className = 'letter'; s.textContent = 'g'; s.setAttribute('aria-hidden', 'true');
    img.replaceWith(s);
  });

  /* ---------- enter ---------- */
  const site = $('#site');
  const enterBtn = $('#enter');
  const audio = $('#audio');
  function play() { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
  enterBtn.addEventListener('click', () => {
    if (document.body.classList.contains('entered')) return;
    document.body.classList.add('entered');
    site.removeAttribute('inert');
    enterBtn.tabIndex = -1;
    enterBtn.setAttribute('aria-hidden', 'true');
    play();
  });

  /* ---------- audio ---------- */
  const playBtns = $$('[data-play]');
  const muteBtn = $('#muteBtn');
  const vol = $('#vol');
  const seek = $('#seek');
  const cur = $('#cur');
  const dur = $('#dur');
  const loopBtn = $('#loopBtn');
  const songStatus = $('#songStatus');

  let v = parseFloat(store.get('dsw-vol'));
  if (!Number.isFinite(v) || v < 0 || v > 1) v = 0.1;
  audio.volume = v;
  audio.muted = store.get('dsw-muted') === '1';

  const fmt = s => {
    if (!Number.isFinite(s)) return '0:00';
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const setFill = (el, pct) => el.style.setProperty('--p', pct + '%');

  function syncPlay() {
    const on = !audio.paused && !audio.ended;
    document.body.classList.toggle('playing', on);
    playBtns.forEach(b => b.setAttribute('aria-label', on ? 'Pause song' : 'Play song'));
  }
  function syncVol() {
    const silent = audio.muted || audio.volume === 0;
    const val = silent ? 0 : Math.round(audio.volume * 100);
    vol.value = val;
    setFill(vol, val);
    muteBtn.classList.toggle('is-muted', silent);
    muteBtn.setAttribute('aria-label', silent ? 'Unmute' : 'Mute');
    muteBtn.setAttribute('aria-pressed', String(silent));
  }
  let dragging = false;
  function syncTime() {
    const d = audio.duration;
    if (Number.isFinite(d) && d > 0) dur.textContent = fmt(d);
    if (dragging) return;
    cur.textContent = fmt(audio.currentTime);
    if (Number.isFinite(d) && d > 0) {
      const p = audio.currentTime / d * 100;
      seek.value = Math.round(p * 10);
      setFill(seek, p);
    }
  }

  playBtns.forEach(b => b.addEventListener('click', () => (audio.paused ? play() : audio.pause())));
  muteBtn.addEventListener('click', () => {
    if (audio.muted || audio.volume === 0) {
      audio.muted = false;
      if (audio.volume === 0) audio.volume = 0.1;
    } else {
      audio.muted = true;
    }
  });
  vol.addEventListener('input', () => {
    const x = vol.value / 100;
    audio.volume = x;
    audio.muted = x === 0;
    setFill(vol, vol.value);
  });
  seek.addEventListener('input', () => {
    dragging = true;
    setFill(seek, seek.value / 10);
    const d = audio.duration;
    if (Number.isFinite(d)) cur.textContent = fmt(seek.value / 1000 * d);
  });
  seek.addEventListener('change', () => {
    const d = audio.duration;
    if (Number.isFinite(d)) audio.currentTime = seek.value / 1000 * d;
    dragging = false;
  });
  loopBtn.addEventListener('click', () => {
    audio.loop = !audio.loop;
    loopBtn.setAttribute('aria-pressed', String(audio.loop));
  });

  ['play', 'pause', 'ended'].forEach(e => audio.addEventListener(e, syncPlay));
  ['timeupdate', 'loadedmetadata', 'durationchange', 'seeked'].forEach(e => audio.addEventListener(e, syncTime));
  audio.addEventListener('volumechange', () => {
    syncVol();
    store.set('dsw-vol', String(audio.volume));
    store.set('dsw-muted', audio.muted ? '1' : '0');
  });
  audio.addEventListener('error', () => {
    songStatus.textContent = "The song couldn't load. You can still play it on Spotify.";
    songStatus.hidden = false;
    playBtns.forEach(b => { b.disabled = true; });
  });
  syncVol();
  syncPlay();

  /* ---------- section rail ---------- */
  const sections = $$('main > section');
  const rail = $('#rail');
  sections.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', s.dataset.navLabel || s.id);
    b.addEventListener('click', () => s.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' }));
    rail.append(b);
  });
  const railBtns = $$('button', rail);
  const markActive = i => railBtns.forEach((b, j) => b.setAttribute('aria-current', String(i === j)));
  markActive(0);
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) markActive(sections.indexOf(e.target)); });
    }, { rootMargin: '-45% 0px -45% 0px' });
    sections.forEach(s => io.observe(s));
  }

  /* ---------- stage light: turns on as you enter ---------- */
  const stage = $('#stage');
  if (reduceMotion) stage.classList.add('lit');
  enterBtn.addEventListener('click', () => stage.classList.add('lit'));

  /* ---------- Velora card: placeholder until nookara's script loads ---------- */
  const veloraWait = $('#veloraWait');
  if (window.customElements) {
    if (customElements.get('velora-card')) veloraWait.hidden = true;
    customElements.whenDefined('velora-card').then(() => { veloraWait.hidden = true; });
  }
  setTimeout(() => {
    if (!window.customElements || !customElements.get('velora-card')) {
      veloraWait.textContent = "The Nookara card couldn't load. An ad blocker or a network filter may be blocking nookara.cc.";
    }
  }, 10000);

  /* ---------- tab title typewriter ---------- */
  const T = '@dsewerek';
  let n = 1, dir = 1;
  (function tick() {
    document.title = T.slice(0, n);
    let wait = dir > 0 ? 160 : 90;
    if (n === T.length && dir > 0) { dir = -1; wait = 1800; }
    else if (n === 1 && dir < 0) { dir = 1; wait = 500; }
    n += dir;
    setTimeout(tick, wait);
  })();

  /* ---------- Discord presence (Lanyard) ---------- */
  const DISCORD_ID = '1292535443619053580';
  const STATUS = { online: 'Online', idle: 'Idle', dnd: 'Do not disturb', offline: 'Offline' };
  const VERB = { 0: 'Playing', 1: 'Streaming', 2: 'Listening to', 3: 'Watching', 5: 'Competing in' };
  const dcArt = $('#dcArt');
  dcArt.addEventListener('error', () => { dcArt.hidden = true; });

  function assetUrl(a) {
    const li = a && a.assets && a.assets.large_image;
    if (!li) return null;
    if (li.startsWith('mp:external/')) return 'https://media.discordapp.net/external/' + li.slice(12);
    if (li.startsWith('spotify:')) return 'https://i.scdn.co/image/' + li.slice(8);
    if (a.application_id) return 'https://cdn.discordapp.com/app-assets/' + a.application_id + '/' + li + '.png';
    return null;
  }
  async function loadDiscord() {
    try {
      const r = await fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID, { cache: 'no-store' });
      const j = await r.json();
      if (!j || !j.success || !j.data) return;
      const d = j.data;
      const u = d.discord_user || {};
      if (u.avatar) {
        $('#dcAv').src = 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.' + (u.avatar.startsWith('a_') ? 'gif' : 'png') + '?size=128';
      }
      if (u.username) $('#dcName').textContent = u.username;

      const st = STATUS[d.discord_status] ? d.discord_status : 'offline';
      const dot = $('#dcDot');
      dot.dataset.status = st;
      dot.title = STATUS[st];
      dot.hidden = false;
      $('#dcStatusText').textContent = STATUS[st];

      const acts = Array.isArray(d.activities) ? d.activities : [];
      const custom = acts.find(a => a.type === 4);
      const main = acts.find(a => a.type !== 4);
      let line = '', sub = '', art = null;
      if (d.listening_to_spotify && d.spotify) {
        line = 'Listening to ' + d.spotify.song;
        sub = 'by ' + d.spotify.artist;
        art = d.spotify.album_art_url;
      } else if (main) {
        line = ((VERB[main.type] || '') + ' ' + main.name).trim();
        sub = main.details || main.state || '';
        art = assetUrl(main);
      } else if (custom && custom.state) {
        line = custom.state;
      }
      $('#dcAct').textContent = line || 'Currently doing nothing';
      const subEl = $('#dcSub');
      subEl.textContent = sub;
      subEl.hidden = !sub;
      if (art) { dcArt.src = art; dcArt.hidden = false; } else { dcArt.hidden = true; }
    } catch (e) { /* keep the fallback text */ }
  }
  loadDiscord();
  setInterval(loadDiscord, 30000);

  /* ---------- GitHub ---------- */
  const nf = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
  fetch('https://api.github.com/users/dsewerek')
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(u => {
      if (u.name) $('#ghName').textContent = u.name;
      $('#ghRepos').textContent = nf.format(u.public_repos || 0);
      $('#ghFollowers').textContent = nf.format(u.followers || 0);
      $('#ghFollowing').textContent = nf.format(u.following || 0);
    })
    .catch(code => {
      $('#ghStats').textContent =
        code === 404 ? "GitHub can't find a user called dsewerek."
        : (code === 403 || code === 429) ? "GitHub's hourly limit was hit on this network. Stats come back within the hour."
        : "Stats didn't load. Open the profile to see them.";
    });

  /* ---------- Minecraft UUID ---------- */
  const MC_UUID = 'c97d6852f216400aa45fe76f1d36dbc3';
  const mcBtn = $('#mcCopy');
  const mcLabel = $('#mcCopyLabel');
  const mcIdle = mcLabel.textContent;
  let mcTimer;
  mcBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(MC_UUID); mcLabel.textContent = 'Copied UUID'; }
    catch (e) { mcLabel.textContent = MC_UUID; }
    clearTimeout(mcTimer);
    mcTimer = setTimeout(() => { mcLabel.textContent = mcIdle; }, 2200);
  });
})();
</script>
</body>
</html>
